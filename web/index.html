<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한양 도감 — 삼국시대</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">한양 도감 <span class="brand-sub">삼국시대</span></h1>
  <div class="status">
    <div id="ink" class="ink" role="img" aria-label="먹물"></div>
    <div id="progress" class="progress" aria-live="polite"></div>
    <div id="dogam-progress" class="progress dogam-progress"></div>
  </div>
  <nav class="actions">
    <button id="btn-dogam" type="button" class="btn">도감</button>
    <button id="btn-new" type="button" class="btn btn-quiet">새 라운드</button>
    <button id="btn-home" type="button" class="btn btn-quiet">처음 화면</button>
  </nav>
</header>

<main class="play" id="play">
  <aside class="hand">
    <div id="card" class="card" tabindex="0" aria-describedby="hand-help"></div>
    <p id="hand-help" class="help" aria-live="polite">카드를 끌어 칸에 놓거나, 카드를 눌러 고른 뒤 칸을 누르세요.</p>
    <section id="feedback" class="feedback"></section>
  </aside>
  <section class="board-wrap" aria-label="나라와 시기 보드">
    <div id="board" class="board"></div>
  </section>
</main>

<div id="dogam" class="overlay" hidden>
  <div class="sheet dogam-sheet" role="dialog" aria-modal="true" aria-labelledby="dogam-title">
    <header class="sheet-head">
      <h2 id="dogam-title">도감</h2>
      <span id="dogam-count" class="dogam-count"></span>
      <button id="btn-dogam-close" type="button" class="btn">닫기</button>
    </header>
    <div class="dogam-body">
      <div class="dogam-main">
        <div id="dogam-grid" class="board dogam-grid"></div>
        <section class="dogam-section" aria-labelledby="disputed-title">
          <h3 id="disputed-title">견해가 나뉘는 기록 <span class="section-sub">판정에서 제외하고 해설용으로만 싣는다</span></h3>
          <div id="dogam-disputed" class="disputed-list"></div>
        </section>
        <section class="dogam-section" aria-labelledby="record-title">
          <h3 id="record-title">플레이 기록 <span class="section-sub">끝난 라운드마다 이 브라우저에 쌓인다</span></h3>
          <div id="play-record" class="play-record"></div>
        </section>
      </div>
      <article id="dogam-detail" class="dogam-detail"></article>
    </div>
  </div>
</div>

<div id="title-screen" class="overlay title-overlay" hidden>
  <div class="title-sheet" role="dialog" aria-modal="true" aria-labelledby="title-name">
    <div class="title-seal" aria-hidden="true">圖鑑</div>
    <h1 id="title-name" class="title-name">한양 도감</h1>
    <p class="title-sub">삼국시대 — 이름이 숨겨진 사건 카드를 단서로 추리해 나라·시기 칸에 놓고 도감을 채운다.</p>
    <p id="title-progress" class="title-progress"></p>
    <div id="title-actions" class="title-actions"></div>
  </div>
</div>

<div id="tutorial" class="overlay tutorial-overlay" hidden>
  <div class="sheet tutorial-sheet" role="dialog" aria-modal="true" aria-labelledby="tut-title">
    <header class="sheet-head">
      <h2 id="tut-title">처음 해 보기</h2>
      <span id="tut-progress" class="dogam-count"></span>
      <button id="tut-skip" type="button" class="btn btn-quiet">건너뛰기</button>
    </header>
    <div class="tutorial-body">
      <div class="tut-left">
        <div id="tut-step" class="tut-step" aria-live="polite"></div>
        <div id="tut-card" class="card tut-card" tabindex="0"></div>
        <div id="tut-feedback" class="feedback" aria-live="polite"></div>
        <div class="tut-actions"><button id="tut-next" type="button" class="btn btn-primary">다음</button></div>
      </div>
      <div id="tut-board" class="board tut-board" aria-label="연습 보드"></div>
    </div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="sheet modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<footer class="foot">
  <span id="data-info"></span>
  <span id="data-warn" class="warn"></span>
</footer>

<div id="drag-ghost" class="drag-ghost" hidden></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
