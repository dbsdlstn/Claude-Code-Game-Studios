# 한양 도감 CI (decision-log D52)
# - data-and-web: 카드 데이터 검증(Python, v1과 v2), 검증기 동등성, 웹 규칙 단위 테스트(Node)
# - godot: Godot 4.7.2 헤드리스로 import 후 gdUnit4 6.2.2로 res://tests 실행, 리포트 업로드
# - godot-screens: Xvfb + Mesa llvmpipe(소프트웨어 OpenGL)로 실제 창을 띄워 주요 화면을 1280×720 PNG로 저장(D55)
# 버전은 모두 고정한다. 바꿀 때는 docs/engine-reference/godot/ 와 docs/run-locally.md 도 함께 고친다.
name: ci

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GDUNIT4_VERSION: "6.2.2"

jobs:
  data-and-web:
    name: data-and-web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Validate deck (samguk.json)
        run: python3 tools/validate_cards.py

      - name: Validate tutorial file
        run: python3 tools/validate_cards.py --tutorial assets/data/cards/tutorial.json

      - name: Validate v2 cards (M1)
        run: python3 tools/validate_cards_v2.py

      - name: Event registry rules (E1-E8 mutation tests)
        run: python3 tools/test_validate_events.py

      - name: Passage variant rules (V16-V21 mutation tests)
        run: python3 tools/test_validate_variants.py

      - name: Validator parity (Python)
        run: python3 tools/validator_parity.py

      - name: GDScript validator port parity
        run: python3 tools/gd_card_validator_port.py --parity

      # E2E(Playwright) 테스트는 브라우저 설치가 무거워 이 잡에서 뺀다(D52). 로컬: web/README.md
      - name: Web unit and parity tests (Node)
        run: node --test web/tests/rules.test.js web/tests/validator-parity.test.js

  godot:
    name: godot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Downloading $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "$url"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          bin="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Install gdUnit4 ${{ env.GDUNIT4_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gdunit"
          ok=""
          # 태그 이름 형식이 v6.2.2 / 6.2.2 중 어느 쪽인지 이 세션에서 확인하지 못해 둘 다 시도한다.
          for tag in "v${GDUNIT4_VERSION}" "${GDUNIT4_VERSION}"; do
            url="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/${tag}.zip"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/gdunit/gdunit.zip" "$url"; then
              echo "Downloaded $url"
              ok="yes"
              break
            fi
          done
          test -n "$ok"
          unzip -q "$RUNNER_TEMP/gdunit/gdunit.zip" -d "$RUNNER_TEMP/gdunit"
          src="$(find "$RUNNER_TEMP/gdunit" -type d -path '*/addons/gdUnit4' | head -n 1)"
          test -n "$src"
          mkdir -p addons
          cp -R "$src" addons/gdUnit4
          test -f addons/gdUnit4/bin/GdUnitCmdTool.gd
          test -f addons/gdUnit4/plugin.cfg

      - name: Enable gdUnit4 plugin (CI checkout only)
        run: |
          set -euo pipefail
          if ! grep -q '^\[editor_plugins\]' project.godot; then
            printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/gdUnit4/plugin.cfg")\n' >> project.godot
          fi
          tail -n 5 project.godot

      - name: Import project (retry once)
        run: |
          set +e
          set -uo pipefail
          # 4.7.1/4.7.2는 새 프로젝트 첫 import가 139로 끝날 수 있다(engine-reference 관찰). 한 번 더 시도한다.
          for attempt in 1 2; do
            "$GODOT" --headless --path . --import 2>&1 | tee "import-$attempt.log"
            code=${PIPESTATUS[0]}
            echo "import attempt $attempt exit $code"
            if [ "$code" -eq 0 ]; then break; fi
          done
          test -f .godot/global_script_class_cache.cfg

      # 파일마다 따로 파싱해 한 번의 실행에서 모든 오류를 본다(import는 첫 오류의 연쇄만 보여 준다).
      - name: Parse check each script
        id: parse
        run: |
          # Actions의 기본 셸은 bash -e다. Godot가 오류로 끝나도 다음 파일을 계속 검사한다.
          set +e
          set -uo pipefail
          : > parse-check.log
          bad=0
          while IFS= read -r f; do
            out="$("$GODOT" --headless --path . --check-only --script "res://$f" 2>&1)"
            code=$?
            if [ "$code" -ne 0 ] || echo "$out" | grep -qE "Parse Error|SCRIPT ERROR|Failed to load"; then
              bad=$((bad + 1))
              { echo "=== $f (exit $code)"; echo "$out" | grep -E "Parse Error|SCRIPT ERROR|at: |Failed to load|ERROR"; } >> parse-check.log
            fi
          done < <(git ls-files 'src/*.gd' 'tests/*.gd')
          echo "scripts with parse errors: $bad"
          cat parse-check.log
          {
            echo "### Parse check"
            echo "scripts with parse errors: $bad"
            echo '```'
            head -n 200 parse-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Run gdUnit4 tests
        id: tests
        if: always()
        run: |
          set +e
          set -uo pipefail
          "$GODOT" --headless --path . -s -d --remote-debug tcp://127.0.0.1:0 \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode 2>&1 | tee gdunit.log
          code=${PIPESTATUS[0]}
          echo "gdUnit4 exit $code (0 pass, 100 fail, 101 warnings/orphans, 105 parse error)"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### gdUnit4"
            echo "exit code: $code"
            echo '```'
            grep -E "Overall Summary|Executed test|passed|failed|errors|orphan" gdunit.log | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: godot-test-reports
          if-no-files-found: warn
          path: |
            reports/
            gdunit.log
            import-*.log
            parse-check.log
            .godot/global_script_class_cache.cfg

      - name: Fail on parse errors
        if: always() && steps.parse.outputs.bad != '0'
        run: |
          echo "::error::${{ steps.parse.outputs.bad }} script(s) failed to parse (see parse-check.log artifact)"
          exit 1

  godot-screens:
    name: godot-screens
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 증거 PNG를 production/qa/evidence/godot/ 에 커밋하므로 이 잡만 쓰기 권한(D55).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0

      # 가상 디스플레이, 소프트웨어 OpenGL(llvmpipe), 한글 글꼴(사용자 PC의 시스템 한글 글꼴을 흉내, D18).
      - name: Install Xvfb, Mesa and Korean fonts
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 fonts-noto-cjk
          fc-list :lang=ko family | head -n 5

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" "$url"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          bin="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Import project (retry once)
        run: |
          set +e
          for attempt in 1 2; do
            "$GODOT" --headless --path . --import > "import-$attempt.log" 2>&1
            code=$?
            echo "import attempt $attempt exit $code"
            if [ "$code" -eq 0 ]; then break; fi
          done
          test -f .godot/global_script_class_cache.cfg

      - name: Capture screens (Xvfb, llvmpipe)
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/screens"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT" --path . --rendering-driver opengl3 --resolution 1280x720 \
            -s res://tests/screens/capture_screens.gd -- --out="$GITHUB_WORKSPACE/screens" 2>&1 | tee capture.log
          code=${PIPESTATUS[0]}
          echo "capture exit $code"
          ls -la "$GITHUB_WORKSPACE/screens"
          count=$(ls "$GITHUB_WORKSPACE/screens"/*.png 2>/dev/null | wc -l)
          {
            echo "### Screens"
            echo "exit $code, $count PNG"
            grep -E "OpenGL|Renderer|llvmpipe|saved|captured|ERROR|SCRIPT ERROR" capture.log | head -n 40
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] || [ "$count" -lt 8 ]; then exit 1; fi

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: godot-screens
          if-no-files-found: warn
          path: |
            screens/
            capture.log
            import-*.log

      # 세션은 artifact 저장소에 접근할 수 없어(프록시 정책) 증거를 저장소에 남긴다. 그림이 바뀐 때만 커밋한다.
      # GITHUB_TOKEN으로 한 push는 워크플로를 다시 실행시키지 않는다.
      - name: Commit screens as QA evidence
        if: success() && github.ref == 'refs/heads/claude/godot-mvp'
        run: |
          set -euo pipefail
          mkdir -p production/qa/evidence/godot
          cp screens/*.png production/qa/evidence/godot/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/qa/evidence/godot
          if git diff --cached --quiet; then
            echo "screens unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(evidence): Godot screens from CI run ${{ github.run_id }}" -m "Ref: docs/decision-log.md D55"
          for attempt in 1 2 3; do
            if git push origin HEAD:claude/godot-mvp; then exit 0; fi
            git pull --rebase origin claude/godot-mvp
          done
          exit 1
