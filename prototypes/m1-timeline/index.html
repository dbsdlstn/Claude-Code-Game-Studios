<!-- PROTOTYPE - NOT FOR PRODUCTION (M1, decision-log D56) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한능검 연표 — M1 프로토타입</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="brand">한능검 연표 <span id="nation-label" class="brand-sub"></span></h1>
  <div class="meta">
    <span id="session-no"></span>
    <span id="progress" aria-live="polite"></span>
  </div>
  <button id="btn-home" type="button" class="btn btn-small" aria-label="타이틀 화면으로">처음</button>
  <button id="btn-dogam" type="button" class="btn btn-small">숙련 도감</button>
</header>

<section id="title" class="title-screen" hidden aria-labelledby="title-name">
  <div class="title-inner">
    <p class="title-seal" aria-hidden="true">史</p>
    <h1 id="title-name" class="title-name">한능검 연표</h1>
    <p class="title-tag">사료를 읽고 왕대 연표에 꽂는 한능검 1급 대비</p>
    <div id="title-nations" class="title-nations" role="group" aria-label="나라"></div>
    <div class="title-actions">
      <p id="title-today" class="title-today" aria-live="polite"></p>
      <button id="title-play" type="button" class="btn btn-primary title-play">시작하기</button>
    </div>
    <div id="title-stats" class="title-stats"></div>
    <div class="title-actions">
      <button id="title-dogam" type="button" class="btn">숙련 도감</button>
      <button id="title-howto" type="button" class="btn">하는 방법</button>
    </div>
  </div>
</section>

<main class="layout">
  <section class="hand" aria-label="사료 카드">
    <article id="card" class="card" tabindex="-1"></article>
  </section>
  <section class="timeline-wrap" aria-labelledby="timeline-title">
    <h2 id="timeline-title" class="timeline-title"></h2>
    <p id="timeline-help" class="help"></p>
    <ol id="timeline" class="timeline"></ol>
  </section>
</main>

<div id="summary" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="summary-title">
    <h2 id="summary-title">세션 결과</h2>
    <div id="summary-body"></div>
    <div class="sheet-actions">
      <button id="summary-skip" type="button" class="btn" hidden>건너뛰기</button>
      <button id="summary-step" type="button" class="btn btn-primary" hidden>계속</button>
      <button id="summary-home" type="button" class="btn" hidden>타이틀로</button>
      <button id="summary-dogam" type="button" class="btn">숙련 도감</button>
      <button id="summary-next" type="button" class="btn btn-primary">다음 세션</button>
    </div>
  </div>
</div>

<div id="dogam" class="overlay" hidden>
  <div class="sheet sheet-tall" role="dialog" aria-modal="true" aria-labelledby="dogam-title">
    <div class="sheet-head">
      <h2 id="dogam-title">숙련 도감</h2>
      <button id="dogam-close" type="button" class="btn btn-small">닫기</button>
    </div>
    <div id="dogam-profile" class="dogam-profile"></div>
    <div id="dogam-tabs" class="tabs" role="tablist" aria-label="도감">
      <button id="tab-cards" type="button" role="tab" class="tab" aria-controls="panel-cards" aria-selected="true">카드</button>
      <button id="tab-ach" type="button" role="tab" class="tab" aria-controls="panel-ach" aria-selected="false" tabindex="-1">업적</button>
      <button id="tab-titles" type="button" role="tab" class="tab" aria-controls="panel-titles" aria-selected="false" tabindex="-1">칭호</button>
      <button id="tab-note" type="button" role="tab" class="tab" aria-controls="panel-note" aria-selected="false" tabindex="-1">오답 노트</button>
    </div>
    <section id="panel-cards" class="panel" role="tabpanel" aria-labelledby="tab-cards">
      <div id="dogam-nations" class="dogam-nations" role="group" aria-label="나라"></div>
      <p id="dogam-counts" class="dogam-counts"></p>
      <div id="dogam-filters" class="filters" role="group" aria-label="등급으로 거르기"></div>
      <p id="dogam-shown" class="source-note" aria-live="polite"></p>
      <ol id="dogam-list" class="dogam-list"></ol>
      <div id="card-detail" class="card-detail" hidden></div>
    </section>
    <section id="panel-ach" class="panel" role="tabpanel" aria-labelledby="tab-ach" hidden>
      <div id="ach-filters" class="filters" role="group" aria-label="업적 거르기"></div>
      <ul id="ach-list" class="ach-list"></ul>
    </section>
    <section id="panel-titles" class="panel" role="tabpanel" aria-labelledby="tab-titles" hidden>
      <p class="source-note">칭호는 표시용이에요. 레벨이 학습 기능을 열지는 않아요.</p>
      <ul id="title-list" class="title-list"></ul>
    </section>
    <section id="panel-note" class="panel note" role="tabpanel" aria-labelledby="tab-note" hidden>
      <p class="source-note">틀린 적 있고 지금 상자 2 이하인 카드예요. 연습은 기록을 바꾸지 않아요. 진짜 복습은 세션에서 돌아와요.</p>
      <button id="btn-note-practice" type="button" class="btn btn-small">오답 노트 연습</button>
      <ol id="note-list" class="note-list"></ol>
    </section>
    <section class="note" aria-labelledby="log-title">
      <h3 id="log-title">플레이테스트 기록</h3>
      <label class="participant">참가자 ID <input id="participant" type="text" maxlength="20" autocomplete="off"></label>
      <p id="log-count" class="source-note"></p>
      <button id="btn-export" type="button" class="btn btn-small">기록 내보내기(JSONL)</button>
    </section>
    <div class="sheet-actions">
      <button id="btn-intro" type="button" class="btn btn-small">처음 안내 다시 보기</button>
      <button id="btn-reset" type="button" class="btn btn-danger btn-small">학습 기록 초기화</button>
    </div>
  </div>
</div>

<div id="intro" class="overlay" hidden>
  <div class="sheet intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" aria-describedby="intro-body">
    <p id="intro-step" class="source-note"></p>
    <h2 id="intro-title"></h2>
    <p id="intro-body"></p>
    <div class="sheet-actions">
      <button id="intro-skip" type="button" class="btn">건너뛰기</button>
      <button id="intro-next" type="button" class="btn btn-primary">다음</button>
    </div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="sheet-actions"></div>
  </div>
</div>

<div id="confirm-dock" class="confirm-dock"></div>
<footer class="foot"><span id="data-info"></span> <strong id="data-warn" class="data-warn" role="note"></strong></footer>
<div id="drag-ghost" class="drag-ghost" hidden></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
